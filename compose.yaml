services:
  db:
    image: postgres:17
    container_name: usage-metering-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: usage_metering
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d usage_metering"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://app_user:local_dev_password@db:5432/usage_metering
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  example-client:
    build: .
    command: ["node", "examples/client.mjs"]
    environment:
      BASE_URL: http://api:3000
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
